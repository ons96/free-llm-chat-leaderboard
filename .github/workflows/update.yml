name: Refresh leaderboard data

on:
  schedule:
    # Weekly, Monday 06:00 UTC — keeps Actions usage minimal (free tier friendly)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Job-level so the step can gate on its presence (secrets context is not
      # allowed in step-level `if:` conditions).
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pyyaml

      # Fetch the live gateway config from VPS-40 using a dedicated, restricted
      # deploy key (VPS_SSH_KEY). The key is forced-command-only on the VPS:
      # it can ONLY run ~/bin/gw-config-fetch.sh, which tars exactly the 5
      # config files the pipeline needs (providers_database, virtual_models,
      # static_virtual_models, dead_providers, chain_pins). No shell access,
      # no port forwarding, no pty. If the secret is absent this step is
      # skipped entirely and the committed snapshot is used instead.
      - name: Fetch gateway config from VPS-40
        if: env.VPS_SSH_KEY != ''
        run: |
          mkdir -p gateway-config
          echo "$VPS_SSH_KEY" > /tmp/vps_deploy_key
          chmod 600 /tmp/vps_deploy_key
          # Pin the VPS host key (ed25519) to prevent MITM.
          echo "40.233.101.233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK+LBwhXGjPQsX7hB4rZdOAiJi0/+22qUjmcTl13RXrk" > /tmp/vps_known_hosts
          ssh -i /tmp/vps_deploy_key \
              -o UserKnownHostsFile=/tmp/vps_known_hosts \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              ubuntu@40.233.101.233 fetch-gateway-config > /tmp/gw.tar.gz
          tar -xzf /tmp/gw.tar.gz -C gateway-config
          python3 scripts/parse_gateway.py gateway-config
          rm -f /tmp/vps_deploy_key

      - name: Refresh data
        env:
          # Optional: AA Data API key. When absent the pipeline falls back to
          # the no-auth public-page scrape, so the run still succeeds.
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python3 scripts/build.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh leaderboard data ($(date -u +%Y-%m-%d))"
            git push
          fi

      # GitHub Pages deploys automatically on push to main (configured via the
      # Pages settings with source branch main, path /).
